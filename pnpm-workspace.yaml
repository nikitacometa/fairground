packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 11 approves dependency build scripts via `allowBuilds` (boolean per package).
# NOTE: the older `onlyBuiltDependencies` key is NOT read by pnpm 11.5 — a fresh
# `pnpm install --frozen-lockfile` (e.g. in Docker) exits 1 with ERR_PNPM_IGNORED_BUILDS
# unless these are set to true. esbuild (via tsup) and sharp (proof-card) need this.
allowBuilds:
  esbuild: true
  sharp: true

# tsx 4.22.4 is newer than pnpm's default minimum-release-age window; allow it.
minimumReleaseAgeExclude:
  - tsx@4.22.4

# packages/contracts is a Python-only AlgoKit workspace.
# It is NOT listed here — AlgoKit manages it independently via .algokit.toml.
# It produces ARC-56 artifacts consumed by packages/sdk, not a pnpm package.
