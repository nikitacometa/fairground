[tool.poetry]
name = "fairground-contracts"
version = "0.1.0"
description = "Fairground Puya smart contracts"
authors = []

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
algorand-python = "3.5.0"
puyapy = "5.8.1"

[tool.poetry.group.dev.dependencies]
algorand-python-testing = "1.1.0"
py-algorand-sdk = "2.11.1"
pytest = ">=7.0"
pytest-asyncio = ">=0.21"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
