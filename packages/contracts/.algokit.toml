[algokit]
min_version = "2.10.2"

[project]
type = "contract"
name = "fairground-contracts"
source = "smart_contracts"
artifacts = "artifacts"

[project.deploy]
genesis_hash = ""
algorand_network = "localnet"

[generate]
client_generator = "client_ts"
client_output_path = "../../packages/sdk/src/clients"
# NOTE: puyapy 5.8.1 outputs ARC-56 by default.
# RESOLVED: algokit-client-generator@6.0.1 fully accepts ARC-56 input despite its npm
# description saying "ARC-0032" (stale description, not a support claim). No
# --output-arc32 fallback needed -- all four clients in packages/sdk/src/clients/ were
# generated this way. See packages/contracts/README.md "ARC-56 vs ARC-32 note".
