# Fairground -- fairground.quest (provably-fair games on Algorand).
#
# Deployed to the shared cometa-proxy nginx: ~/cometa/proxy/conf.d/fairground.quest.conf
# (cometa-proxy owns :80/:443; the fairground stack is separate but shares the host).
# cometa-proxy must be attached to the fairground-external docker network so it can
# reach the backends by name:  docker network connect fairground_fairground-external cometa-proxy
#
# Routing:
#   fairground.quest, www  -> fairground-landing:80   (Astro static)
#   app.fairground.quest   -> fairground-game:3000    (Next.js)
#   api.fairground.quest   -> fairground-api:3010     (Hono REST + WS)
#
# Single certificate (named after the apex) covers all four names:
#   certbot certonly --webroot -w /var/www/certbot \
#     -d fairground.quest -d www.fairground.quest -d app.fairground.quest -d api.fairground.quest

# WebSocket upgrade map for the api live feed (nginx.conf defines no such map).
map $http_upgrade $fg_connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP: ACME challenge + redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name fairground.quest www.fairground.quest app.fairground.quest api.fairground.quest;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- api.fairground.quest -> fairground-api:3010 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.fairground.quest;

    ssl_certificate /etc/letsencrypt/live/fairground.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fairground.quest/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FAIRGROUND_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Docker embedded DNS so container IPs are re-resolved per request -- a fairground
    # container can be recreated (new IP) without a stale upstream / 502 here.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        limit_req zone=api burst=20 nodelay;
        set $fg_api http://fairground-api:3010;
        proxy_pass $fg_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fg_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}

# ---- app.fairground.quest -> fairground-game:3000 (Next.js) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.fairground.quest;

    ssl_certificate /etc/letsencrypt/live/fairground.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fairground.quest/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FAIRGROUND_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Docker embedded DNS so container IPs are re-resolved per request -- a fairground
    # container can be recreated (new IP) without a stale upstream / 502 here.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=general burst=40 nodelay;
        set $fg_game http://fairground-game:3000;
        proxy_pass $fg_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fg_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- fairground.quest (apex) + www -> fairground-landing:80 (Astro static) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fairground.quest www.fairground.quest;

    ssl_certificate /etc/letsencrypt/live/fairground.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fairground.quest/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FAIRGROUND_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Docker embedded DNS so container IPs are re-resolved per request -- a fairground
    # container can be recreated (new IP) without a stale upstream / 502 here.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # www -> apex
    if ($host = www.fairground.quest) {
        return 301 https://fairground.quest$request_uri;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        set $fg_landing http://fairground-landing:80;
        proxy_pass $fg_landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
